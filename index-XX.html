<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sawgrass Blog Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: work-surface tool. Outline editor on the left, live white "page" proof on the right, export sheet on demand. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --sunk:#f6f7f9; --ink:#101921; --muted:#626876; --line:#d9dce3;
  --accent:#e04584; --accent-ink:#ffffff; --accent-soft:#fbe6ef; --warn:#b4570b; --warn-soft:#fdf0e3; --ok:#1d7a4a; --note-soft:#eef0f4;
  --f-ui:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --panel:#151b24; --sunk:#10151c; --ink:#e9ecf1; --muted:#99a0ad; --line:#29313d;
  --accent:#ee5b97; --accent-ink:#ffffff; --accent-soft:#3a1c2a; --warn:#f0a35a; --warn-soft:#3a2714; --ok:#5fcf93; --note-soft:#1c232e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#151b24; --sunk:#10151c; --ink:#e9ecf1; --muted:#99a0ad; --line:#29313d;
  --accent:#ee5b97; --accent-ink:#ffffff; --accent-soft:#3a1c2a; --warn:#f0a35a; --warn-soft:#3a2714; --ok:#5fcf93; --note-soft:#1c232e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
#postName{margin-right:auto}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.status.bad{background:var(--warn-soft);color:var(--warn)}
.status.good{color:var(--ok)}
.name{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:14px;min-width:0;width:min(280px,100%)}
.name:hover,.name:focus{border-color:var(--line);background:var(--sunk)}
.saved{font-size:12px;color:var(--muted);white-space:nowrap}
.saved.dirty{color:var(--warn)}
.drafts{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.drafts li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.drafts li.cur{border-color:var(--accent)}
.drafts .dn{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
.drafts .dm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.drafts .sec{border:0;padding:8px 2px 0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.drafts .empty{color:var(--muted);border-style:dashed;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.small{padding:5px 10px;font-size:12px}

.wrap{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;padding:20px;align-items:start}
@media (max-width:1000px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0;font-weight:700}
.ph .meta{color:var(--muted);font-size:12px}

#stack{list-style:none;margin:0;padding:8px;display:grid;gap:6px}
.blk{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.blk.open{border-color:var(--accent)}
.blk.flag .blk-n{background:var(--warn-soft);color:var(--warn)}
.blk-head{display:flex;align-items:center}
.blk-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px;text-align:left}
.blk-n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.blk.open .blk-n{background:var(--accent);color:var(--accent-ink)}
.blk-txt{min-width:0;display:grid}
.blk-name{font-weight:600}
.blk-sum{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:2px;padding-right:6px}
.tools button{border:0;background:none;min-width:28px;height:28px;border-radius:5px;color:var(--muted);font-size:14px}
.tools button:hover{background:var(--sunk);color:var(--ink)}
.tools button:disabled{opacity:.3;cursor:default}
.fields{padding:4px 12px 14px 44px;display:grid;gap:12px}
@media (max-width:480px){.fields{padding-left:12px}}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=url],#meName,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:8px 10px}
.field textarea{min-height:84px;resize:vertical}
.field textarea.mono{font-family:var(--f-mono);font-size:12.5px;min-height:120px;white-space:pre;overflow:auto}
.range{display:flex;gap:10px;align-items:center}
.range input{flex:1;accent-color:var(--accent)}
.range output{font-variant-numeric:tabular-nums;font-weight:600;min-width:48px;text-align:right}
.hint{font-size:11.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgf{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:start;border:1px dashed var(--line);border-radius:8px;padding:10px;background:var(--sunk)}
.imgf.drag{border-color:var(--accent);background:var(--accent-soft)}
.thumb{width:72px;height:72px;border-radius:6px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--muted);text-align:center;cursor:pointer;padding:4px}
.thumb img{width:100%;height:100%;object-fit:cover}
.imgf .stack{display:grid;gap:6px;min-width:0}
.imgf input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:6px 8px;font-size:12.5px}
.imgf input.need{border-color:var(--warn)}
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.icons button{height:40px;border:1px solid var(--line);background:var(--sunk);border-radius:6px;display:grid;place-items:center;color:var(--ink);font-size:10.5px;font-weight:600;padding:0}
.icons button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.icons svg{width:22px;height:22px}
.list{display:grid;gap:10px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:10px;min-width:0}
.item .item{background:var(--sunk)}
.item-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.item-h span:last-child{display:flex;gap:10px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0;font-size:12px}
details.sty{border-top:1px solid var(--line);padding-top:10px}
details.sty summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
details.sty[open] summary{margin-bottom:10px}
.sty-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.sty-grid,.row2{grid-template-columns:1fr}}

.lib{padding:12px 12px 16px;border-top:1px solid var(--line);display:grid;gap:14px}
.lib-g h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.lib-grid button{border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:8px 10px;text-align:left;display:grid;gap:2px}
.lib-grid button:hover{border-color:var(--accent)}
.lib-grid b{font-size:13px}
.lib-grid span{font-size:11.5px;color:var(--muted);line-height:1.3}

.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (max-width:1000px){.pv{position:static}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:none;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.stage{background:var(--sunk);padding:20px;max-height:calc(100vh - 150px);overflow:auto;border-radius:0 0 10px 10px}
@media (max-width:1000px){.stage{max-height:none;padding:12px}}
#frame{display:block;background:#ffffff;margin:0 auto;width:100%;max-width:900px;box-shadow:0 1px 3px rgba(16,25,33,.12);transition:max-width .2s;overflow:hidden}
#frame.mobile{max-width:390px}
@media (prefers-reduced-motion:reduce){#frame{transition:none}}

[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--panel);border-radius:12px;width:min(880px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.sheet-body{padding:16px;display:grid;gap:14px;overflow:auto}
.issues{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.issues li{display:flex;gap:10px;align-items:baseline;background:var(--warn-soft);padding:8px 10px;border-radius:6px;font-size:13px}
.issues li b{color:var(--warn);font-variant-numeric:tabular-nums;white-space:nowrap}
.issues li.note{background:var(--note-soft)}
.issues li.note b{color:var(--muted)}
.issues li button{margin-left:auto}
.issues li.ok{background:var(--sunk)}
.issues li.ok b{color:var(--ok)}
#code{width:100%;min-height:260px;font-family:var(--f-mono);font-size:12px;line-height:1.5;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--sunk);resize:vertical;white-space:pre;overflow:auto}
.sheet-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet-foot p{margin:0 auto 0 0;color:var(--muted);font-size:12.5px;max-width:62ch}
</style>

<header class="bar">
  <div class="brand"><b>Blog Builder</b><span>Sawgrass · v3</span></div>
  <input id="postName" class="name" type="text" aria-label="Post name" placeholder="Name this post">
  <span id="saved" class="saved"></span>
  <span id="status" class="status">Checking…</span>
  <button id="authBtn" class="btn" hidden>Sign in for team drafts</button>
  <button id="draftsBtn" class="btn">Drafts</button>
  <button id="saveBtn" class="btn">Save draft</button>
  <button id="clearBtn" class="btn">New post</button>
  <button id="exportBtn" class="btn primary">Export HTML</button>
</header>

<main class="wrap">
  <section class="panel" aria-label="Outline">
    <div class="ph"><h2>Outline</h2><span id="count" class="meta" style="margin-left:auto"></span></div>
    <ol id="stack"></ol>
    <div id="lib" class="lib"></div>
  </section>

  <section class="panel pv" aria-label="Preview">
    <div class="ph"><h2>Preview</h2>
      <span class="meta">Click a section to edit it</span>
      <div class="seg" role="group" aria-label="Preview width">
        <button id="vDesk" aria-pressed="true">Desktop</button><button id="vMob" aria-pressed="false">Mobile</button>
      </div>
    </div>
    <div class="stage"><div id="frame"></div></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="ph"><h2 id="mTitle">Export HTML</h2><button id="closeBtn" class="btn small" style="margin-left:auto">Close</button></div>
    <div class="sheet-body">
      <ul id="issues" class="issues"></ul>
      <textarea id="code" readonly spellcheck="false" aria-label="Exported HTML"></textarea>
      <div class="sheet-foot">
        <p id="footNote">Paste into the HTML widget on the post. Styles are scoped to this post, so they won't affect the rest of the site.</p>
        <button id="copyBtn" class="btn primary">Copy HTML</button>
      </div>
    </div>
  </div>
</div>

<div id="dmodal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="ph"><h2 id="dTitle">Drafts</h2><button id="dClose" class="btn small" style="margin-left:auto">Close</button></div>
    <div class="sheet-body">
      <div id="meWrap" class="field" hidden style="max-width:320px"><label for="meName">Your name (shows on drafts you save)</label><input id="meName" type="text" placeholder="e.g. Brett"></div>
      <ul id="draftList" class="drafts"></ul>
      <div class="sheet-foot">
        <p id="dNote"></p>
        <label class="btn" for="draftFile" style="cursor:pointer">Open draft file</label>
        <input id="draftFile" type="file" accept=".json,application/json" hidden>
        <button id="dlBtn" class="btn primary">Download draft file</button>
      </div>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\/)[^\s)]+)\)/g,'<a href="$2">$1</a>');
const para=s=>String(s||'').trim().split(/\n\s*\n/).filter(Boolean).map(p=>'<p>'+inl(p.trim()).replace(/\n/g,'<br>')+'</p>').join('');
let seq=0; const nid=()=>'b'+Date.now().toString(36)+(seq++);
const IMG=(url,alt)=>({local:'',url:url||'',alt:alt||''});
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- brand tokens (Brand Guide 2026) ---------- */
const COL={black:'#101921',gray:'#888B95',white:'#FFFFFF',pink:'#E04584',orange:'#FF7F39'};
const DARK=new Set(['pink','orange','black','grad']);
const WT={bold:['var(--sgb-bold)',700],medium:['var(--sgb-med)',500],book:['var(--sgb-book)',400]};
const TEXTC=[['','Auto'],['black','Black'],['gray','Cool Gray'],['white','White'],['pink','Pink · needs approval'],['orange','Orange · needs approval']];
const ICOLS=[['','Auto'],['gray','Cool Gray'],['black','Black'],['white','White'],['pink','Pink · needs approval'],['orange','Orange · needs approval']];
const BTNV=[['primary','Primary (pink)'],['secondary','Secondary (orange)'],['outline','Outline (pink)'],['white','White (on color)'],['outline-white','White outline (on color)']];

/* ---------- icons: thin line, rounded, per brand guide ---------- */
const c=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}"/>`;
const ICONS={
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  alert:'<path d="M12 4 2.8 19.5a1 1 0 0 0 .9 1.5h16.6a1 1 0 0 0 .9-1.5L12 4zM12 10v4M12 17.5v.01"/>',
  info:c(12,12,9)+'<path d="M12 11v5M12 8v.01"/>',
  check:c(12,12,9)+'<path d="m8 12.5 2.5 2.5L16 9.5"/>',
  star:'<path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/>',
  clock:c(12,12,9)+'<path d="M12 7v5l3 2"/>',
  heat:'<path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0zM12 9v7"/>',
  shirt:'<path d="M8 3 3 6l2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.7-2 3-4 3S8.5 4.7 8 3z"/>',
  mug:'<path d="M5 7h11v9a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 10h2a2 2 0 0 1 0 4h-2M8 3v2M11 3v2"/>',
  printer:'<path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2M7 14h10v7H7z"/>',
  sparkle:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  question:c(12,12,9)+'<path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17v.01"/>',
  gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8C10.5 5 7 5 7 7s3 1 5 1zm0 0c1.5-3 5-3 5-1s-3 1-5 1z"/>',
  tag:'<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/>'+c(7.5,7.5,1.5),
  dollar:c(12,12,9)+'<path d="M14.5 9.5c-.4-.9-1.3-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1.1 1.6 2.5 2 2.5.9 2.5 2-1.1 2-2.5 2c-1.2 0-2.2-.6-2.5-1.5M12 6.5V8M12 16v1.5"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M3 20h18"/>',
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  play:c(12,12,9)+'<path d="M10 8.5v7l6-3.5z"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
const svgI=(name,color,cls)=>ICONS[name]?`<svg class="${cls||'sgb-icon'}" style="color:${color}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`:'';
const icoColor=(k,dark)=>k?COL[k]:(dark?COL.white:COL.gray);

/* ---------- shared fields ---------- */
const ICONF=(extra)=>[{k:'icon',l:'Icon',t:'icon',struct:1},{k:'iconImg',l:'Custom icon file',t:'img',opt:1,noalt:1,show:o=>o.icon==='custom'},
  {k:'iconColor',l:'Icon color',t:'select',opts:ICOLS,show:o=>o.icon&&o.icon!=='custom'}].concat(extra||[]);
const BTNF=(p,lbl)=>[{k:p+'Label',l:lbl||'Button text',t:'text',need:p+'Url'},{k:p+'Url',l:'Button link',t:'url'},{k:p+'Var',l:'Button style',t:'select',opts:BTNV}];
const EL_KINDS=[['text','Text'],['heading','Heading'],['image','Image'],['button','Button'],['icon','Icon'],['spacer','Spacer']];
const is=k=>o=>o.kind===k;

/* ---------- module library ---------- */
const ALLST=['align','bg','hLevel','hColor','hWeight','bColor','bSize','bWeight','hover','space'];
const M={
  title:{name:'Title & intro',desc:'Headline, subhead, intro',g:'Text',
    fields:[{k:'headline',l:'Headline',t:'text'},{k:'sub',l:'Subhead',t:'text'},{k:'intro',l:'Intro copy',t:'area'}],
    st:['align','hLevel','hColor','hWeight','bColor','bSize','bWeight','space'],sd:{align:'center'},
    def:()=>({headline:'Post Headline',sub:'Supporting Subhead',intro:'One or two sentences that set up the post.'}),
    r:(d,x)=>hd(d.headline,x.H)+(d.sub?`<p class="sgb-sub">${inl(d.sub)}</p>`:'')+(d.intro?`<div class="sgb-intro">${para(d.intro)}</div>`:'')},
  text:{name:'Text section',desc:'Heading and body copy',g:'Text',
    fields:[{k:'heading',l:'Heading (optional)',t:'text'},{k:'body',l:'Body',t:'area'}],st:ALLST,

function newEl(kind){return {kind,heading:'Heading',level:'h3',body:'Text goes here.',img:IMG(),iw:'100',label:'Learn More',url:'',v:'primary',icon:'star',iconColor:'',h:30};}
function renderEl(e,x){
  switch(e.kind){
    case 'heading': return hd(e.heading,e.level||'h3');
    case 'text': return `<div>${para(e.body)}</div>`;
    case 'image': return im(e.img,x,{w:+e.iw});
    case 'button': return e.label?`<div class="sgb-btns">${btn(e.label,e.url,e.v)}</div>`:'';
    case 'icon': return svgI(e.icon,icoColor(e.iconColor,x.dark));
    case 'spacer': return `<div style="height:${+e.h||30}px"></div>`;
  } return '';
}

/* ---------- render helpers ---------- */
const nextH=h=>({h2:'h3',h3:'h4',h4:'h5',h5:'h5'})[h]||'h4';
const hd=(t,h,cls)=>t?`<${h}${cls?` class="${cls}"`:''}>${inl(t)}</${h}>`:'';
const btn=(l,u,v,size,newtab)=>`<a class="sgb-btn sgb-btn-${v||'primary'}${size?' sgb-btn-'+size:''}" href="${esc(u)}"${newtab?' target="_blank" rel="noopener"':''}>${esc(l)}</a>`;
function iconOf(o,x,dark){
  if(!o.icon) return '';
  if(o.icon==='custom') return im(o.iconImg,x,{opt:1,raw:'sgb-icon',shape:'ic'});
  return svgI(o.icon,icoColor(o.iconColor,dark));
}
function ytId(u){ const m=String(u||'').match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/); return m?m[1]:''; }
function im(v,x,o){
  o=o||{}; v=v||IMG();
  if(!v.local&&!v.url&&o.opt) return '';
  const hst=o.h?` style="height:${o.h}px;width:100%;object-fit:cover"`:'';
  let tag;
  if(x.mode==='preview'){
    tag=v.local?`<img${o.raw?` class="${o.raw}"`:''} src="${v.local}" alt="${esc(v.alt)}"${hst}>`
      :`<span class="sgb-ph ${o.shape||''}${o.raw?' '+o.raw:''}"${o.h?` style="height:${o.h}px;aspect-ratio:auto"`:''}>${v.url?'Hosted image set. Drop in the file to preview it.':'Add image'}</span>`;
  } else tag=`<img${o.raw?` class="${o.raw}"`:''} src="${esc(v.url)}" alt="${esc(v.alt)}" loading="lazy"${hst}>`;
  if(o.raw) return tag;
  const w=o.w&&o.w<100;
  let out=`<span class="sgb-imgwrap${w?' sgb-w':''}" style="${w?`width:${o.w}%;`:''}${+o.round?`border-radius:${o.round}px;`:''}">${tag}</span>`;
  if(o.link) out=`<a class="sgb-imglink" href="${esc(o.link)}">${out}</a>`;
  return out;
}

const BASE_ST={align:'',bg:'',hLevel:'h2',hColor:'',hWeight:'',bColor:'',bSize:'',bWeight:'',hover:'',space:'50'};
const STF={
  align:{l:'Alignment',opts:[['','Left (default)'],['center','Center'],['right','Right']]},
  bg:{l:'Background',opts:[['','None'],['white','White card + shadow'],['gray','Gray 25%'],['pink','Pink'],['orange','Orange'],['black','Black'],['grad','Pink to orange gradient']]},
  hLevel:{l:'Heading size',opts:[['h2','H2 · 48px'],['h3','H3 · 36px'],['h4','H4 · 28px'],['h5','H5 · 22px']]},
  hColor:{l:'Heading color',opts:TEXTC},
  hWeight:{l:'Heading weight',opts:[['','Default for size'],['bold','Bold'],['medium','Medium'],['book','Book']]},
  bColor:{l:'Text color',opts:TEXTC},
  bSize:{l:'Text size',opts:[['','Body · 16px'],['18','Large · 18px'],['20','XL · 20px'],['14','Small · 14px']]},
  bWeight:{l:'Text weight',opts:[['','Book (default)'],['medium','Medium'],['bold','Bold']]},
  hover:{l:'Hover effect',opts:[['','None'],['lift','Lift'],['grow','Enlarge'],['color','Color change'],['zoom','Image zoom']]},
  space:{l:'Space below',opts:[['0','None'],['20','20px'],['50','50px (default)'],['70','70px'],['100','100px']]}
};
function renderBlock(b,mode){
  const m=M[b.type], st=Object.assign({},BASE_ST,m.sd||{},b.style||{});
  const dark=DARK.has(st.bg);
  const x={mode,H:st.hLevel,H2:nextH(st.hLevel),dark,st};
  const inner=m.r(b.data,x);
  const cls=['sgb-block','sgb-'+b.type];
  if(st.align) cls.push('sgb-a-'+st.align);
  if(st.bg&&m.st.includes('bg')){cls.push('sgb-cell','sgb-bg-'+st.bg); if(dark) cls.push('sgb-dark');}
  if(st.hover&&m.st.includes('hover')) cls.push((m.kids?'sgb-kids-':'sgb-hv-')+st.hover);
  if(m.cls) cls.push(m.cls(b.data));
  const v=[];
  if(st.hColor) v.push('--h-c:'+COL[st.hColor]);
  if(st.bColor) v.push('--b-c:'+COL[st.bColor]);
  if(st.hWeight){v.push('--h-ff:'+WT[st.hWeight][0],'--h-fw:'+WT[st.hWeight][1]);}
  if(st.bWeight){v.push('--b-ff:'+WT[st.bWeight][0],'--b-fw:'+WT[st.bWeight][1]);}
  if(st.bSize) v.push('--b-s:'+st.bSize+'px');
  v.push('margin-bottom:'+(+st.space||0)+'px');
  const tag=m.tag||'section';
  return `<${tag}${mode==='preview'?` data-bid="${b.id}"`:''} class="${cls.join(' ')}${mode==='preview'&&b.id===open?' sel':''}" style="${v.join(';')}">${inner}</${tag}>`;
}

/* ---------- checks ---------- */
function walk(fields,obj,prefix,cb){
  fields.forEach(f=>{
    if(f.show&&!f.show(obj)) return;
    if(f.t==='list') (obj[f.k]||[]).forEach((it,i)=>walk(f.item,it,`${prefix}${f.noun} ${i+1} › `,cb));
    else cb(f,obj[f.k],prefix+f.l.replace(/ \(.*\)/,''),obj);
  });
}
function issues(){
  const out=[];
  if(!blocks.length) out.push({i:-1,msg:'The post is empty. Add a module.'});
  blocks.forEach((b,i)=>{
    const st=Object.assign({},BASE_ST,M[b.type].sd||{},b.style||{});
    walk(M[b.type].fields,b.data,'',(f,v,label,obj)=>{
      if(f.t==='img'){
        v=v||IMG(); const used=v.local||v.url;
        if(f.opt&&!used) return;
        if(!v.url) out.push({i,msg:`${label}: needs a hosted URL from the Media Library`});
        else if(!/^https:\/\//.test(v.url)) out.push({i,msg:`${label}: URL should start with https://`});
        else if(!/sawgrassink\.com\/wp-content\//.test(v.url)) out.push({i,lvl:'note',msg:`${label}: URL isn't in the WordPress Media Library`});
        if(used&&!f.noalt&&!String(v.alt||'').trim()) out.push({i,msg:`${label}: add alt text`});
        if(v.size>3e6&&v.gif) out.push({i,lvl:'note',msg:`${label}: GIF is ${(v.size/1e6).toFixed(1)} MB. Large GIFs slow the page; aim for under 3 MB.`});
      } else if(f.t==='url'&&v&&!/^(https?:\/\/|\/)/.test(v)) out.push({i,msg:`${label}: link should start with https://`});
      else if(f.t==='url'&&f.req&&!v) out.push({i,msg:`${label}: add the link`});
      else if(f.need&&v&&!obj[f.need]) out.push({i,msg:`${label}: has text but no link`});
    });
    if(b.type==='video'&&!ytId(b.data.url)) out.push({i,msg:'Add a valid YouTube link'});
    if(b.type==='table'&&!String(b.data.rows||'').trim()) out.push({i,msg:'The table is empty'});
    const M_=M[b.type].st;
    if(M_.includes('hColor')&&/pink|orange/.test(st.hColor)||M_.includes('bColor')&&/pink|orange/.test(st.bColor))
      out.push({i,lvl:'note',msg:'Color text needs approval per the brand guide'});
  });
  return out;
}
function exportHTML(){
  const hasYT=blocks.some(b=>b.type==='video'&&b.data.auto==='yes'&&ytId(b.data.url));
  return `<!-- Built with Sawgrass Blog Builder -->\n<style>\n${CSS}\n</style>\n<div class="sgb">\n${blocks.map(b=>renderBlock(b,'export')).join('\n\n')}\n</div>`+(hasYT?'\n'+YT_SCRIPT:'');
}

  async list(){ const d=getDrafts(); return Object.keys(d).map(id=>({id,name:d[id].name,savedAt:d[id].savedAt,count:(d[id].blocks||[]).length})); },
  async get(id){ const d=getDrafts()[id]; return d?{id,name:d.name,savedAt:d.savedAt,blocks:d.blocks}:null; },
  async put(id,doc){ const d=getDrafts(); d[id]=doc; if(!putDrafts(d)) throw new Error('storage'); },
  async del(id){ const d=getDrafts(); delete d[id]; putDrafts(d); }};
let user=null, db=null, cloudOn=false, draftStore='local';
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let myName=lsGet('sgb-me'); let clientId=lsGet('sgb-client'); if(!clientId){ clientId='c'+Math.random().toString(36).slice(2,10); lsSet('sgb-client',clientId); }
const me=()=>user?{name:user.displayName||user.email,id:user.email}:{name:myName||'Someone',id:clientId};
const teamReady=()=>cloudOn&&(user||!REQUIRE_SIGN_IN);
const COLL='blogDrafts';
const CloudStore={kind:'cloud',
  async list(){ const q=await db.collection(COLL).orderBy('savedAt','desc').limit(200).get();
    return q.docs.map(x=>{const v=x.data();return {id:x.id,name:v.name,savedAt:v.savedAt,count:v.count,by:v.byName,byId:v.byId};}); },
  async get(id){ const x=await db.collection(COLL).doc(id).get(); if(!x.exists) return null; const v=x.data();
    return {id,name:v.name,savedAt:v.savedAt,by:v.byName,byId:v.byId,blocks:JSON.parse(v.blocks||'[]')}; },
  async put(id,doc){ await db.collection(COLL).doc(id).set({name:doc.name,savedAt:doc.savedAt,blocks:JSON.stringify(doc.blocks,strip),count:doc.blocks.length,byName:me().name,byId:me().id}); },
  async del(id){ await db.collection(COLL).doc(id).delete(); }};
const activeStore=()=>teamReady()?CloudStore:LocalStore;
const storeOf=k=>k==='cloud'?CloudStore:LocalStore;

function renderSaved(){ const el=$('#saved'), where=draftStore==='cloud'?'to team ':'';
  if(dirty&&draftId){el.textContent='Unsaved changes';el.className='saved dirty';}
  else if(savedAt){el.textContent='Saved '+where+fmtTime(savedAt);el.className='saved';}
  else {el.textContent=draftId?'':'Not saved as a draft yet';el.className='saved';} }
const saveBtn=$('#saveBtn');
function disarmSave(){ delete saveBtn.dataset.armed; saveBtn.textContent='Save draft'; saveBtn.style.color=''; }
async function saveDraft(force){
  if(cloudOn&&REQUIRE_SIGN_IN&&!user){ toast('Sign in with Google to save shared drafts. Saving in this browser for now.'); }
  const S=activeStore();
  if(!draftId) draftId='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const name=postName.trim()||(blocks.find(b=>b.type==='title')||{data:{}}).data.headline||'Untitled post';
  if(!postName.trim()){ postName=name; $('#postName').value=name; }
  if(S.kind==='cloud'&&!force){
    try{ const cur=await S.get(draftId);
      if(cur&&cur.byId!==me().id&&(!savedAt||cur.savedAt>savedAt)){
        saveBtn.dataset.armed=1; saveBtn.textContent=`Overwrite ${String(cur.by||'their').split(' ')[0]}'s newer save?`; saveBtn.style.color='var(--warn)';
        setTimeout(disarmSave,6000); return; }
    }catch(e){}
  }
  disarmSave();
  const doc={name,savedAt:Date.now(),blocks:clone(blocks)};
  try{ await S.put(draftId,doc); draftStore=S.kind; dirty=false; savedAt=doc.savedAt; save(); renderSaved();
    toast(S.kind==='cloud'?'Draft saved for the team':'Draft saved in this browser'); }
  catch(e){ toast(S.kind==='cloud'?'Couldn\'t reach the team drafts. Check your connection and try again.':'Couldn\'t save. This browser is blocking storage or is full.'); }
}
async function loadDraft(id,kind){
  let d=null; try{ d=await storeOf(kind).get(id); }catch(e){}
  if(!d||!valid(d.blocks)){ toast('That draft could not be opened'); return false; }
  blocks=clone(d.blocks); postName=d.name||''; draftId=id; draftStore=kind; savedAt=d.savedAt; dirty=false; open=null;
  $('#postName').value=postName; save(); renderAll(); renderSaved(); toast('Opened '+postName); return true;
}
async function renderDrafts(){
  const ul=$('#draftList');
  $('#meWrap').hidden=!(teamReady()&&!user);
  $('#dNote').textContent=teamReady()
    ?(user?`Team drafts are shared with everyone signed in with an @${ALLOWED_EMAIL_DOMAIN} Google account.`:'Team drafts are shared with anyone who has the builder link.')+' Download a draft file for a backup or to send it outside the team.'
    :(cloudOn&&REQUIRE_SIGN_IN?'Sign in with Google (top bar) to see and save team drafts. Until then, drafts save in this browser only.'
      :'Drafts are saved in this browser. To hand one to Rachel or the copy editor, download the draft file and send it; they open it here with Open draft file. The file keeps your preview images too.');
  ul.innerHTML='<li class="empty">Loading drafts…</li>';
  const sections=[];
  if(teamReady()){ try{ sections.push(['cloud','Team drafts',await CloudStore.list()]); }catch(e){ sections.push(['cloud','Team drafts',null]); } }
  const loc=await LocalStore.list(); if(!teamReady()||loc.length) sections.push(['local',teamReady()?'Only in this browser':'',loc]);
  ul.innerHTML=sections.map(([k,label,items])=>(label?`<li class="sec">${label}</li>`:'')+(items===null?'<li class="empty">Couldn\'t load team drafts. Check your connection.</li>'
    :items.length?items.sort((a,b)=>b.savedAt-a.savedAt).map(it=>`<li class="${it.id===draftId&&k===draftStore?'cur':''}"><span class="dn">${esc(it.name)}</span><span class="dm">${fmtTime(it.savedAt)}${it.by?' · '+esc(String(it.by).split(' ')[0]):''} · ${it.count||0} modules</span>
      <button class="btn small" data-open="${it.id}" data-k="${k}">${it.id===draftId&&k===draftStore?'Reopen saved version':'Open'}</button><button class="btn small" data-del="${it.id}" data-k="${k}">Delete</button></li>`).join('')
    :`<li class="empty">${k==='cloud'?'No team drafts yet. Use Save draft in the top bar.':'No saved drafts yet. Use Save draft in the top bar.'}</li>`)).join('');
  ul.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',async()=>{ if(await loadDraft(b.dataset.open,b.dataset.k)) $('#dmodal').hidden=true; }));
  ul.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    if(!b.dataset.armed){ b.dataset.armed=1; b.textContent='Delete for good?'; b.style.color='var(--warn)'; return; }
    try{ await storeOf(b.dataset.k).del(b.dataset.del); }catch(e){ toast('Couldn\'t delete that draft'); return; }
    if(draftId===b.dataset.del&&draftStore===b.dataset.k){draftId=null;savedAt=null;save();renderSaved();}
    renderDrafts(); }));
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function renderAuth(){ const b=$('#authBtn'); b.hidden=!(cloudOn&&REQUIRE_SIGN_IN); b.textContent=user?'Sign out '+String(user.displayName||user.email).split(' ')[0]:'Sign in for team drafts'; }
async function initCloud(){
  if(!FIREBASE_CONFIG) return;
  const base='https://www.gstatic.com/firebasejs/10.14.1/';
  try{ for(const f of ['firebase-app-compat.js'].concat(REQUIRE_SIGN_IN?['firebase-auth-compat.js']:[],['firebase-firestore-compat.js'])) await loadScript(base+f);
    firebase.initializeApp(FIREBASE_CONFIG); db=firebase.firestore(); }
  catch(e){ toast('Team drafts are unavailable here, so drafts will save in this browser.'); return; }
  cloudOn=true;
  if(!REQUIRE_SIGN_IN){ renderSaved(); return; }
  renderAuth();
  firebase.auth().onAuthStateChanged(u=>{
    if(u&&ALLOWED_EMAIL_DOMAIN&&!String(u.email||'').toLowerCase().endsWith('@'+ALLOWED_EMAIL_DOMAIN.toLowerCase())){
      firebase.auth().signOut(); toast('Sign in with your @'+ALLOWED_EMAIL_DOMAIN+' Google account'); return; }
    user=u||null; renderAuth(); renderSaved();
  });
  $('#authBtn').addEventListener('click',()=>{
    if(user){ firebase.auth().signOut(); return; }
    const p=new firebase.auth.GoogleAuthProvider(); if(ALLOWED_EMAIL_DOMAIN) p.setCustomParameters({hd:ALLOWED_EMAIL_DOMAIN});
    firebase.auth().signInWithPopup(p).catch(e=>{ if(e&&e.code!=='auth/popup-closed-by-user') toast('Sign-in didn\'t finish: '+(e.code||'try again')); });
  });
}
function toDataURL(src){ return fetch(src).then(r=>r.blob()).then(bl=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(bl);})); }
async function downloadDraft(){
  const copy=JSON.parse(JSON.stringify(blocks,(k,v)=>(k==='size'||k==='gif')?undefined:v)); const jobs=[];
  (function walkL(o){ if(Array.isArray(o)) o.forEach(walkL); else if(o&&typeof o==='object'){ if(typeof o.local==='string'&&o.local.startsWith('blob:')) jobs.push(toDataURL(o.local).then(u=>{o.local=u;}).catch(()=>{o.local='';})); Object.values(o).forEach(walkL);} })(copy);
  await Promise.all(jobs);
  const name=postName.trim()||'blog-draft';
  const blob=new Blob([JSON.stringify({app:'sawgrass-blog-builder',version:3,name,savedAt:Date.now(),blocks:copy})],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.blogdraft.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Draft file downloaded');
}
function openDraftFile(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{ const j=JSON.parse(fr.result); if(!valid(j.blocks)) throw 0;
      blocks=j.blocks; postName=j.name||''; draftId=null; savedAt=null; dirty=true; open=null;
      $('#postName').value=postName; save(); renderAll(); renderSaved(); $('#dmodal').hidden=true; toast('Opened '+(postName||'draft file')+'. Save draft to keep it in this browser.');
    }catch(e){ toast('That file isn\'t a Blog Builder draft'); } };
  fr.readAsText(file);
}

/* ---------- editor ---------- */
const stack=$('#stack');
function summary(b){ const d=b.data; return d.headline||d.heading||d.title||d.label||(d.items&&d.items[0]&&d.items[0].title)||(d.img&&d.img.alt)||(b.type==='spacer'?d.h+'px'+(d.line?' · line':''):'')||(b.type==='video'?(ytId(d.url)||'No link yet'):''); }
function selectEl(id,opts,val,onch){ const el=document.createElement('select'); el.id=id; opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if((val||'')===v)o.selected=true;el.appendChild(o);}); el.addEventListener('change',()=>onch(el.value)); return el; }
function buildField(f,obj,where){
  const w=document.createElement('div'); w.className='field';
  const fid=('f-'+where+'-'+f.k).replace(/[^\w-]/g,'');
  if(f.t==='text'||f.t==='url'||f.t==='area'){
    w.innerHTML=`<label for="${fid}">${esc(f.l)}</label>`;
    const el=document.createElement(f.t==='area'?'textarea':'input');
    if(f.t!=='area'){ el.type=f.t==='url'?'url':'text'; if(f.t==='url') el.placeholder='https://'; }
    if(f.mono) el.className='mono';
    el.id=fid; el.value=obj[f.k]||'';
    el.addEventListener('input',()=>{obj[f.k]=el.value; changed(false);});
    w.appendChild(el);
    if(f.hint) w.insertAdjacentHTML('beforeend',`<span class="hint">${esc(f.hint)}</span>`);
    else if(f.t==='area') w.insertAdjacentHTML('beforeend','<span class="hint">Blank line = new paragraph · **bold** · [link text](https://…) for backlinks</span>');
  } else if(f.t==='select'){
    w.innerHTML=`<label for="${fid}">${esc(f.l)}</label>`;
    w.appendChild(selectEl(fid,f.opts,obj[f.k],v=>{obj[f.k]=v; changed(!!f.struct);}));
  } else if(f.t==='range'){
    w.innerHTML=`<label for="${fid}">${esc(f.l)}</label><div class="range"><input id="${fid}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${+obj[f.k]||f.min}"><output>${+obj[f.k]||f.min}${f.unit}</output></div>`;
    const r=w.querySelector('input'), o=w.querySelector('output');
    r.addEventListener('input',()=>{obj[f.k]=+r.value; o.textContent=r.value+f.unit; changed(false);});
  } else if(f.t==='icon'){
    w.innerHTML=`<span class="lbl">${esc(f.l)}</span>`;
    const g=document.createElement('div'); g.className='icons'; g.setAttribute('role','group');
    const opts=[['',f.none||'None']].concat(Object.keys(ICONS).map(k=>[k,k])).concat(f.nocustom?[]:[['custom','Upload']]);
    opts.forEach(([k,l])=>{ const b=document.createElement('button'); b.type='button'; b.title=l; b.setAttribute('aria-label',l);
      b.setAttribute('aria-pressed',(obj[f.k]||'')===k); b.innerHTML=ICONS[k]?svgI(k,'currentColor',''):`<span>${esc(l)}</span>`;
      b.addEventListener('click',()=>{obj[f.k]=k; if(k==='custom'&&!obj.iconImg) obj.iconImg=IMG(); changed(true);}); g.appendChild(b); });
    w.appendChild(g);
  } else if(f.t==='img'){
    if(!obj[f.k]) obj[f.k]=IMG();
    const v=obj[f.k];
    w.innerHTML=`<span class="lbl">${esc(f.l)}</span>
      <div class="imgf"><label class="thumb" for="${fid}-file" title="Choose a file">${v.local?`<img src="${v.local}" alt="">`:'Drop or<br>choose file'}</label>
      <input id="${fid}-file" type="file" accept="image/*" hidden>
      <div class="stack">
        <input id="${fid}-url" type="url" placeholder="Hosted URL from Media Library" value="${esc(v.url)}" aria-label="Hosted image URL">
        ${f.noalt?'':`<input id="${fid}-alt" type="text" placeholder="Alt text: describe the image" value="${esc(v.alt)}" aria-label="Alt text">`}
        ${(v.local||v.url)?'<button type="button" class="linkbtn" data-rm style="justify-self:start">Remove image</button>':''}
      </div></div>`;
    const box=w.querySelector('.imgf'), file=w.querySelector('input[type=file]'), url=w.querySelector('input[type=url]'), alt=w.querySelector('input[aria-label="Alt text"]');
    const mark=()=>url.classList.toggle('need',!!v.local&&!v.url);
    const setFile=fl=>{ if(!fl||!/^image\//.test(fl.type)) return; if(v.local) URL.revokeObjectURL(v.local); v.local=URL.createObjectURL(fl); v.size=fl.size; v.gif=/gif/.test(fl.type); changed(true); };
    file.addEventListener('change',()=>setFile(file.files[0]));
    ['dragenter','dragover'].forEach(e=>box.addEventListener(e,ev=>{ev.preventDefault();box.classList.add('drag');}));
    ['dragleave','drop'].forEach(e=>box.addEventListener(e,ev=>{ev.preventDefault();box.classList.remove('drag');}));
    box.addEventListener('drop',ev=>setFile(ev.dataTransfer.files[0]));
    url.addEventListener('input',()=>{v.url=url.value.trim(); mark(); changed(false);});
    if(alt) alt.addEventListener('input',()=>{v.alt=alt.value; changed(false);});
    const rm=w.querySelector('[data-rm]'); if(rm) rm.addEventListener('click',()=>{ if(v.local) URL.revokeObjectURL(v.local); obj[f.k]=IMG(); changed(true); });
    mark();
  } else if(f.t==='list'){
    w.innerHTML=`<span class="lbl">${esc(f.l)}</span>`;
    const list=document.createElement('div'); list.className='list';
    const arr=obj[f.k]=obj[f.k]||[];
    arr.forEach((it,i)=>{
      const card=document.createElement('div'); card.className='item';
      card.innerHTML=`<div class="item-h"><span>${f.noun} ${i+1}</span><span>
        ${i>0?'<button type="button" class="linkbtn" data-a="up">Move up</button>':''}
        <button type="button" class="linkbtn" data-a="dup">Duplicate</button>
        ${arr.length>f.min?'<button type="button" class="linkbtn" data-a="rm">Remove</button>':''}</span></div>`;
      f.item.forEach(g=>{ if(g.show&&!g.show(it)) return; card.appendChild(buildField(g,it,where+'-'+f.k+i)); });
      card.querySelectorAll('[data-a]').forEach(bt=>bt.addEventListener('click',()=>{
        const a=bt.dataset.a;
        if(a==='up') arr.splice(i-1,0,arr.splice(i,1)[0]);
        if(a==='rm') arr.splice(i,1);
        if(a==='dup'&&arr.length<f.max) arr.splice(i+1,0,clone(it));
        changed(true);
      }));
      list.appendChild(card);
    });
    if(arr.length<f.max){
      const add=document.createElement('button'); add.type='button'; add.className='btn small'; add.style.justifySelf='start'; add.textContent='+ Add '+f.noun.toLowerCase();
      add.addEventListener('click',()=>{ let o; if(f.newItem) o=f.newItem(); else { o={}; f.item.forEach(g=>o[g.k]=g.t==='img'?IMG():g.t==='select'?g.opts[0][0]:g.t==='range'?g.min:''); if('title' in o) o.title=f.noun+' '+(arr.length+1); }
        arr.push(o); changed(true); });
      list.appendChild(add);
    }
    w.appendChild(list);
  }
  return w;
}
function buildStyle(b){
  const m=M[b.type]; if(!m.st.length) return null;
  b.style=b.style||{};
  const st=Object.assign({},BASE_ST,m.sd||{},b.style);
  const d=document.createElement('details'); d.className='sty'; if(openStyle.has(b.id)) d.open=true;
  d.addEventListener('toggle',()=>{ d.open?openStyle.add(b.id):openStyle.delete(b.id); });
  d.innerHTML='<summary>Style · fonts, color, hover, spacing</summary>';
  const g=document.createElement('div'); g.className='sty-grid';
  m.st.forEach(k=>{ const f=STF[k], w=document.createElement('div'); w.className='field'; const id='s-'+b.id+'-'+k;
    w.innerHTML=`<label for="${id}">${f.l}</label>`;
    w.appendChild(selectEl(id,f.opts,st[k],v=>{ b.style[k]=v; changed(false); }));
    g.appendChild(w); });
  d.appendChild(g);
  return d;
}
function flagged(){ const s=new Set(); issues().forEach(x=>{if(x.i>=0&&x.lvl!=='note')s.add(x.i)}); return s; }
function renderStack(){
  const fl=flagged();
  stack.innerHTML='';
  blocks.forEach((b,i)=>{
    const mod=M[b.type];
    const li=document.createElement('li'); li.className='blk'+(open===b.id?' open':'')+(fl.has(i)?' flag':''); li.dataset.id=b.id;
    li.innerHTML=`<div class="blk-head">
      <button class="blk-toggle" aria-expanded="${open===b.id}"><span class="blk-n">${i+1}</span><span class="blk-txt"><span class="blk-name">${esc(mod.name)}</span><span class="blk-sum">${esc(summary(b))}</span></span></button>
      <div class="tools">
        <button data-a="up" aria-label="Move up" title="Move up" ${i===0?'disabled':''}>↑</button>
        <button data-a="down" aria-label="Move down" title="Move down" ${i===blocks.length-1?'disabled':''}>↓</button>
        <button data-a="dup" aria-label="Duplicate" title="Duplicate">⧉</button>
        <button data-a="del" aria-label="Delete" title="Delete">✕</button>
      </div></div>`;
    li.querySelector('.blk-toggle').addEventListener('click',()=>{open=open===b.id?null:b.id; renderAll();});
    li.querySelectorAll('.tools button').forEach(btn=>btn.addEventListener('click',()=>{
      const a=btn.dataset.a;
      if(a==='up'&&i>0) blocks.splice(i-1,0,blocks.splice(i,1)[0]);
      if(a==='down'&&i<blocks.length-1) blocks.splice(i+1,0,blocks.splice(i,1)[0]);
      if(a==='dup'){ const c=clone(b); c.id=nid(); blocks.splice(i+1,0,c); open=c.id; }
      if(a==='del'){ if(btn.dataset.armed){ blocks.splice(i,1); if(open===b.id) open=null; } else { btn.dataset.armed=1; btn.textContent='Delete?'; btn.style.color='var(--warn)'; setTimeout(()=>{ if(btn.isConnected){delete btn.dataset.armed;btn.textContent='✕';btn.style.color='';} },2500); return; } }
      changed(true);
    }));
    if(open===b.id){
      const fs=document.createElement('div'); fs.className='fields';
      mod.fields.forEach(f=>{ if(f.show&&!f.show(b.data)) return; fs.appendChild(buildField(f,b.data,b.id)); });
      const sty=buildStyle(b); if(sty) fs.appendChild(sty);
      li.appendChild(fs);
    }
    stack.appendChild(li);
  });
  $('#count').textContent=blocks.length+(blocks.length===1?' module':' modules');
}
function renderLib(){
  const lib=$('#lib'); const groups={};
  const add=(g,label,desc,fn)=>{ (groups[g]=groups[g]||[]).push([label,desc,fn]); };
  Object.entries(M).forEach(([k,m])=>{
    if(m.presets) Object.entries(m.presets).forEach(([p,pr])=>add(m.g,pr.label,pr.desc,()=>mk(k,p)));
    else add(m.g,m.name,m.desc,()=>mk(k));
  });
  ['Text','Media','Callouts & lists','Actions','Layout'].forEach(g=>{
    const sec=document.createElement('div'); sec.className='lib-g'; sec.innerHTML=`<h3>${g}</h3>`;
    const grid=document.createElement('div'); grid.className='lib-grid';
    (groups[g]||[]).forEach(([label,desc,fn])=>{
      const b=document.createElement('button'); b.type='button'; b.innerHTML=`<b>${esc(label)}</b><span>${esc(desc)}</span>`;
      b.addEventListener('click',()=>{ const nb=fn(); const at=open?blocks.findIndex(x=>x.id===open)+1:blocks.length; blocks.splice(at||blocks.length,0,nb); open=nb.id; changed(true);
        requestAnimationFrame(()=>{ const el=stack.querySelector(`[data-id="${nb.id}"]`); if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'}); }); });
      grid.appendChild(b);
    });
    sec.appendChild(grid); lib.appendChild(sec);
  });
  lib.insertAdjacentHTML('afterbegin','<p class="hint" style="margin:0">New modules go below the open one, or at the end.</p>');
}

function renderStatus(){
  const n=issues().filter(x=>x.lvl!=='note').length, s=$('#status');
  s.className='status '+(n?'bad':'good');
  s.textContent=n?`${n} to fix before export`:'Ready to export';

let raf=0;
function changed(structural){
  if(!dirty){ dirty=true; renderSaved(); }
  save();
  if(structural){ renderAll(); return; }
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{ renderPreview(); renderStatus();
    const fl=flagged(); stack.querySelectorAll('.blk').forEach((li,i)=>{ li.classList.toggle('flag',fl.has(i)); const b=blocks[i]; if(b) li.querySelector('.blk-sum').textContent=summary(b); }); });
}
function renderAll(){ renderStack(); renderPreview(); renderStatus(); }

/* ---------- chrome ---------- */
const setView=m=>{ frame.classList.toggle('mobile',m); $('#vMob').setAttribute('aria-pressed',m); $('#vDesk').setAttribute('aria-pressed',!m); };
$('#vDesk').addEventListener('click',()=>setView(false));
$('#vMob').addEventListener('click',()=>setView(true));
const modal=$('#modal');
function openExport(){
  const list=issues(), ul=$('#issues'), fixes=list.filter(x=>x.lvl!=='note');
  ul.innerHTML=(list.length?list.map(x=>`<li class="${x.lvl==='note'?'note':''}"><b>${x.i>=0?'Module '+(x.i+1):'Post'}</b><span>${esc(x.msg)}</span>${x.i>=0?`<button class="btn small" data-go="${x.i}">Go to</button>`:''}</li>`).join(''):'')
    +(fixes.length?'':'<li class="ok"><b>Ready</b><span>Every image has a hosted URL and alt text, and every button has a link.</span></li>');
  ul.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{ open=blocks[+b.dataset.go].id; modal.hidden=true; renderAll();
    const li=stack.querySelector(`[data-id="${open}"]`); if(li) li.scrollIntoView({block:'start',behavior:'smooth'}); }));
  const code=exportHTML(); $('#code').value=code;
  $('#footNote').textContent='Paste into the HTML widget on the post. Styles are scoped to this post, so they won\'t affect the rest of the site.'+(/<script>/.test(code)?' Includes a small script that starts the video when it scrolls into view.':'');
  $('#copyBtn').textContent=fixes.length?'Copy anyway':'Copy HTML';
  modal.hidden=false; $('#closeBtn').focus();
}
$('#exportBtn').addEventListener('click',openExport);
$('#closeBtn').addEventListener('click',()=>{modal.hidden=true;});
modal.addEventListener('click',e=>{ if(e.target===modal) modal.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) modal.hidden=true; });
$('#copyBtn').addEventListener('click',()=>{
  const ta=$('#code'), btn=$('#copyBtn');
  const fallback=()=>{ ta.focus(); ta.select(); btn.textContent='Selected. Press Ctrl/⌘+C'; };
  try{ navigator.clipboard.writeText(ta.value).then(()=>{btn.textContent='Copied';},fallback); }catch(e){ fallback(); }
});
const clr=$('#clearBtn');
clr.addEventListener('click',()=>{
  if(!clr.dataset.armed){ clr.dataset.armed=1; clr.textContent='Clear everything?'; setTimeout(()=>{delete clr.dataset.armed; clr.textContent='New post';},3000); return; }
  delete clr.dataset.armed; clr.textContent='New post';
  blocks=[mk('title')]; open=blocks[0].id; postName=''; draftId=null; draftStore='local'; savedAt=null; dirty=false; $('#postName').value=''; save(); renderAll(); renderSaved();
});

blocks=load()||seed();
if(draftId&&draftStore==='local'){ const d=getDrafts()[draftId]; if(d){ savedAt=d.savedAt; dirty=JSON.stringify(d.blocks,strip)!==JSON.stringify(blocks,strip); } else draftId=null; }
$('#postName').value=postName;
$('#postName').addEventListener('input',e=>{ postName=e.target.value; dirty=true; save(); renderSaved(); });
saveBtn.addEventListener('click',()=>saveDraft(!!saveBtn.dataset.armed));
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveDraft(false); } });
const dm=$('#dmodal');
$('#draftsBtn').addEventListener('click',()=>{ renderDrafts(); dm.hidden=false; $('#dClose').focus(); });
$('#dClose').addEventListener('click',()=>{ dm.hidden=true; });
dm.addEventListener('click',e=>{ if(e.target===dm) dm.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') dm.hidden=true; });
$('#dlBtn').addEventListener('click',()=>{ downloadDraft().catch(()=>toast('Download didn\'t start. Try again.')); });
$('#draftFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) openDraftFile(f); e.target.value=''; });
$('#meName').value=myName; $('#meName').addEventListener('input',e=>{ myName=e.target.value.trim(); lsSet('sgb-me',myName); });
renderLib(); renderAll(); renderSaved(); initCloud();
})();
</script>

</body></html>
